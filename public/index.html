<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/react-datepicker@6.2.0/dist/react-datepicker.css" />
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* DatePicker overrides to match Tailwind style */
      .react-datepicker-wrapper { width: 100%; }
      .react-datepicker__input-container input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        font-family: 'Inter', sans-serif;
        outline: none;
        background: white;
        color: #111827;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .react-datepicker__input-container input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      }
      .react-datepicker__input-container input.dp-error {
        border-color: #ef4444;
      }
      .react-datepicker { font-family: 'Inter', sans-serif; border: 1px solid #e5e7eb; border-radius: 0.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
      .react-datepicker__header { background: #6366f1; border-bottom: none; border-radius: 0.5rem 0.5rem 0 0; padding-top: 10px; }
      .react-datepicker__current-month, .react-datepicker__day-name { color: white; font-weight: 600; }
      .react-datepicker__day--selected { background-color: #6366f1 !important; border-radius: 50%; color: white; }
      .react-datepicker__day:hover { background-color: #e0e7ff; border-radius: 50%; }
      .react-datepicker__navigation-icon::before { border-color: white; }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="root"></div>
  </body>
</html>
